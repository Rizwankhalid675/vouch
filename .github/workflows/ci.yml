name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 is the floor: this repository and the conformance CLI both import
          # .ts files directly, which needs Node's type stripping, on by default
          # from 22.18.
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The conformance CLI has no test runner of its own: its tests run under this
      # one, from tools/**/tests.
      - run: npm test

      # `npm test` SKIPS the five real-server CORS tests, loudly, where listen() is
      # refused -- a suite expected to be red is how a real failure gets ignored.
      # This runner can bind, so here they are DEMANDED: CONFORMANCE_CORS_REQUIRED
      # removes the skip, and a refused bind fails the build. This step is the only
      # place a CORS header is read off something other than an object we built
      # ourselves, so it is also the only automated evidence that check exists.
      - name: CORS tests against a real loopback server, required
        run: npm run test:cors

      - run: npm run build
      - run: npm run build:peer

      # A smoke test of the shipped CLI, not of this site: it must answer usefully
      # for a URL that is not a conforming agent site, and must not crash. Exit 1
      # (checks failed) is the expected answer here; exit 3 would mean the tool
      # itself broke, and that is what this catches.
      - name: conformance CLI runs and reports rather than crashing
        run: |
          set +e
          node tools/conformance/cli.ts https://example.com/agents/not_a_real_network
          code=$?
          set -e
          echo "exit $code"
          test "$code" = "1"
