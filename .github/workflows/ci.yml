name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18 is the floor: this repository and the conformance CLI both import
          # .ts files directly, which needs Node's type stripping, on by default
          # from 22.18.
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The conformance CLI has no test runner of its own: its tests run under this
      # one, from tools/**/tests.
      - run: npm test

      # `npm test` SKIPS the five real-server CORS tests, loudly, where listen() is
      # refused -- a suite expected to be red is how a real failure gets ignored.
      # This runner can bind, so here they are DEMANDED: CONFORMANCE_CORS_REQUIRED
      # removes the skip, and a refused bind fails the build. This step is the only
      # place a CORS header is read off something other than an object we built
      # ourselves, so it is also the only automated evidence that check exists.
      - name: CORS tests against a real loopback server, required
        run: npm run test:cors

      - run: npm run build
      - run: npm run build:peer

      # A smoke test of the shipped CLI, not of this site: it must answer usefully
      # for a URL that is not a conforming agent site, and must not crash.
      #
      # Asserting only on exit 1 was not a smoke test. A 404, an HTML 200 and a
      # total network failure all produced exit 1, so an offline runner looked
      # exactly like a working CLI. Two changes fix that:
      #
      #  - The target is a loopback server this step starts, so "could the runner
      #    reach the internet today" is no longer part of the result. That
      #    dependence is precisely what made the old assertion meaningless.
      #  - The assertions are on --json. The manifest check must have FAILED, not
      #    been declined for want of a connection; nothing may be unreachable
      #    (exit 4's counter must be zero); the six declined checks must still be
      #    there; and summary.exitCode must agree with the process exit code.
      - name: conformance CLI reaches a real host and reports rather than crashing
        run: |
          mkdir -p /tmp/smoke
          python3 -m http.server 8751 --bind 127.0.0.1 --directory /tmp/smoke &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null "http://127.0.0.1:8751/" && break || sleep 0.2; done
          set +e
          node tools/conformance/cli.ts http://127.0.0.1:8751/agents/not_a_real_network --json > /tmp/conf.json
          code=$?
          set -e
          echo "exit $code"
          cat /tmp/conf.json
          test "$code" = "1"
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/conf.json", "utf8"));
            const manifest = d.results.find((x) => x.check === "manifest-reachable");
            if (manifest.status !== "fail") throw new Error("expected manifest-reachable to FAIL, got " + manifest.status + " -- that is an unreachable server, not a working CLI");
            if (d.summary.neverReached !== 0) throw new Error("the CLI never reached the loopback server; this proves nothing about it");
            if (d.summary.notChecked < 6) throw new Error("expected at least the six declined checks, got " + d.summary.notChecked);
            if (d.summary.exitCode !== 1) throw new Error("summary.exitCode disagrees with the process exit code");
            console.log("smoke test ok:", JSON.stringify(d.summary));
          '
